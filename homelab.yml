# Classification metadata for this app. Schema documented in
# infrastructure/WEBAPP_PROJECT_STANDARD.md §1a — that doc is authoritative.
#
# Consumers read this instead of re-deriving these facts: Homepage tile generation, the proxy's
# personal-data gate, /deploy's profile detection (deploy-common.sh), and any future fleet
# inventory tool.

schema_version: 1

app: holiday-house-comparison
profile: B
description: "Static comparison page for sled-trip holiday houses, scraped from rental listing sites"

# The proxy route below serves the local target, published by the shared /deploy
# (infrastructure/scripts/deploy.sh local) into /samba/server/www/holiday-house-comparison/.
# The external FTP host is published separately by this repo's own deploy.sh/deploy.ps1.
route: /holiday-house-comparison

# Read as "requires auth", not literally "personal data" (§1a's documented conflation) -- the
# listing data is public (fewo-direkt/booking.com/huetten.com/interhome) and the trip notes on
# top of it aren't sensitive. The reason is legal/ToS exposure from scraping commercial rental
# sites and republishing the results on a public site, same shape as housebuycomparison. See
# compliance/holiday-house-comparison.md §5 (in the infrastructure repo — this repo is public,
# §1b) for the full reasoning.
personal_data: true
