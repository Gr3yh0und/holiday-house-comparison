name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # = cave-server, where the build runs (one version only, owner 2026-11-16)
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Must stay byte-identical to deploy.config.example's TEST_CMD (§7): CI that runs a
      # different command than the deploy gate is checking a different thing.
      - run: pytest
