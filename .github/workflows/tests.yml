name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"   # = cave-server, where the build runs (one version only, owner 2026-11-16)
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Must stay byte-identical to deploy.config.example's TEST_CMD (§7): CI that runs a
      # different command than the deploy gate is checking a different thing.
      - run: pytest
